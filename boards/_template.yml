# ╭─────────────────────────────────────────────────────────╮
# │  你的画板                                                  │
# │  复制此文件到 boards/<你的名字>/board.yml,然后改下面的内容    │
# │  最少改 to_self 和 to_strangers 两个字段就够了              │
# ╰─────────────────────────────────────────────────────────╯


# ─── 必填 ────────────────────────────────────────────────

name: "你的名字(化名也行)"

# 写给自己的话,1-5 条,每条不超过 140 字
to_self:
  - "今天的我,做到 60% 就够了。"

# 写给陌生访客的话,1-5 条,每条不超过 140 字
to_strangers:
  - "你能读到这里,说明你今天没有放弃自己 —— 这本身就是了不起的事。"


# ─── 选填(但很推荐填) ──────────────────────────────────

# 一个能代表你的 emoji
emoji: "🌱"

# 主题色调,影响画板外观
# 可选: warm / soft / bright / quiet / mono
theme: warm

# 三个以内的标签
tags:
  - "反内卷"

link: ""

mood_today: "平静"


# ─── 选填: 一张图 ───────────────────────────────────────
# 代表你今天的状态、你的一面墙、一杯咖啡、一束光……什么都行
# 必须是 https:// 链接 或 ./local-file 相对路径
#
# image: "https://images.unsplash.com/photo-..."
#
# 或者带描述(更可访问):
# image:
#   src: "https://images.unsplash.com/photo-..."
#   alt: "雨夜窗边一盏小灯"


# ─── 选填: 一首歌 ───────────────────────────────────────
# 支持 YouTube / Bilibili / 网易云音乐 / Spotify / SoundCloud / Apple Music / 直接 .mp3 链接
# 你想让陌生人在你的画板上,听见你想分享的歌
#
# song: "https://music.163.com/song?id=..."
#
# 或者带歌名和"为什么":
# song:
#   url: "https://music.163.com/song?id=..."
#   title: "夜空中最亮的星 — 逃跑计划"
#   why: "凌晨三点听这首歌的时候,我做了一个决定。"
