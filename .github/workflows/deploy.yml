name: Build & Validate

# Cloudflare Pages 通过 dashboard 直接连 GitHub 自动 build + deploy
# 这个 workflow 只负责在 PR 时跑 validate + build,保证不会有人 push 坏掉的画板进来
# 部署本身由 Cloudflare 接管,见 README.md「部署」一节

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Validate all boards
        run: npm run validate

      - name: Build site
        run: npm run build
